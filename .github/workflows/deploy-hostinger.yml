name: Deploy para Hostinger

# Cada push no main sobe as duas pastas para a Hostinger por SFTP (porta 65002).
#   deploy-hostinger-site/ -> andracoengenharia.com.br     (site institucional)
#   deploy-hostinger-lp/   -> lp.andracoengenharia.com.br  (LP)
# Secrets do repositório: FTP_HOST (só o IP), FTP_USER e FTP_PASSWORD da conta principal
# (na Hostinger a senha do FTP principal é a mesma do SSH).
# O acesso SSH precisa estar ATIVO no hPanel (Avançado > Acesso SSH).
# Por que SFTP e não FTP: o servidor aceita o login FTP, mas derruba a conexão de dados
# vinda do GitHub (ECONNRESET), tanto em FTPS quanto em FTP simples.
# Sem --delete: nada que já está no servidor é apagado (pastas pagina-*, backup etc.).
on:
  push:
    branches: [ main ]
    paths:
      - 'deploy-hostinger-site/**'
      - 'deploy-hostinger-lp/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  SFTP_PORT: 65002

jobs:
  deploy:
    name: Site e LP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Site (andracoengenharia.com.br)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -p "$SFTP_PORT" -u "$FTP_USER" --env-password "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; mirror -R --verbose --parallel=4 --exclude-glob .git* --exclude-glob .DS_Store deploy-hostinger-site/ domains/andracoengenharia.com.br/public_html/; bye"

      - name: LP (lp.andracoengenharia.com.br)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -p "$SFTP_PORT" -u "$FTP_USER" --env-password "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; mirror -R --verbose --parallel=4 --exclude-glob .git* --exclude-glob .DS_Store deploy-hostinger-lp/ domains/andracoengenharia.com.br/public_html/lp/; bye"
